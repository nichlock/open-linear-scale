; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = release

[env]
platform = ststm32
board = nucleo_l476rg
framework = stm32cube
upload_protocol = jlink
debug_tool = jlink
monitor_speed = 460800
build_flags = -DDEBUG_BAUDRATE=460800
              -DUSE_FULL_LL_DRIVER
              -Wall
              -Wformat=2

[env:release]
extra_scripts = post:scripts/sync_fpu_linkflags.py
build_flags = ${env.build_flags} -mfpu=fpv4-sp-d16 -mfloat-abi=hard
              -Wl,-u,_printf_float ; enable %f in newlib-nano printf

# These are for testing the floating point timings.
[env:bench_softfp]
build_src_filter = +<*> -<measure-main-events.cpp> -<sensor-math.cpp> +<../test/benchmark-fpu-main.cpp>
build_flags = ${env.build_flags} -mfloat-abi=soft
extra_scripts = post:scripts/sync_fpu_linkflags.py

[env:bench_hardfp]
build_src_filter = +<*> -<measure-main-events.cpp> -<sensor-math.cpp> +<../test/benchmark-fpu-main.cpp>
build_flags = ${env.build_flags} -mfpu=fpv4-sp-d16 -mfloat-abi=hard
extra_scripts = post:scripts/sync_fpu_linkflags.py

